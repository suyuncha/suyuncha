<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Record</title>
  <link rel="icon" href="images/favicon.png">
  <link rel="stylesheet" href="style.css">
  <style>
    /* 페이지를 열면 레코드판이 바로 돌아요. 판이 캔버스 한가운데에 있어야 제자리에서 돌아요 */
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    .disc {
      animation: spin 4s linear infinite;
    }
    /* 누르면 멈추고, 다시 누르면 이어서 돌아요 */
    #pushed:checked ~ .disc {
      animation-play-state: paused;
    }
  </style>
</head>
<body>
  <main class="stage">
    <input type="radio" name="pen" id="pushed">
    <input type="radio" name="pen" id="reset">

    <!-- 레코드판 -->
    <img class="layer disc" src="images/record.png" alt="A hand-drawn vinyl record spinning, with a small picture on its label">

    <!-- 눈에 안 보이는 클릭 영역: 돌고 있을 때 누르면 멈추고, 멈춰 있을 때 누르면 다시 돌아요 -->
    <label for="pushed" class="lab-out"></label>
    <label for="reset" class="lab-in"></label>

    <a class="arrow" href="archive.html">
      <img class="off" src="images/arrow3.png" alt="next">
      <img class="on" src="images/arrow3-hover.png" alt="">
    </a>
  </main>
</body>
</html>
