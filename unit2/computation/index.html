<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pen</title>
  <link rel="icon" href="images/favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <input type="radio" name="pen" id="pushed">
    <input type="radio" name="pen" id="reset">

    <img class="layer body" src="images/pen-body.png" alt="">
    <img class="layer nib" src="images/pen-nib.png" alt="">

    <label for="pushed" class="lab-out"><img src="images/pen-click-out.png" alt=""></label>
    <label for="reset" class="lab-in"><img src="images/pen-click-in.png" alt=""></label>

    <a class="arrow" href="writing.html">
      <img class="off" src="images/arrow1.png" alt="next">
      <img class="on" src="images/arrow1-hover.png" alt="">
    </a>
  </main>
</body>
</html>
