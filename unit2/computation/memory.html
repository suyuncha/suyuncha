<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memory</title>
  <link rel="icon" href="images/favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <img class="layer" src="images/memory-word.png" alt="Memory">
  <main class="stage memory">
    <input type="radio" name="pen" id="pushed">
    <input type="radio" name="pen" id="reset">
    <label for="pushed" class="lab-out"><img src="images/memory.png" alt="A hand-drawn side view of a brain"></label>
    <label for="reset" class="lab-in"><img src="images/memory-hippo.png" alt="The hippocampus, drawn alone"></label>
    
    <a class="arrow" href="identity.html">
      <img class="off" src="images/arrow5.png" alt="next">
      <img class="on" src="images/arrow5-hover.png" alt="">
    </a>
  </main>
</body>
</html>
