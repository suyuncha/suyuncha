<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Writing</title>
  <link rel="icon" href="images/favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <input type="radio" name="pen" id="pushed">

    <!-- 처음 그림. 누르면 사라지고, 다시 누를 수 없어요 -->
    <label for="pushed" class="lab-out"><img src="images/writing.png" alt=""></label>
    <!-- 점이 찍힌 그림. 누른 뒤에 나타나서 그대로 남아요 (nib 규칙을 재사용) -->
    <img class="layer nib" src="images/writing_dot.png" alt="">

    <a class="arrow" href="record.html">
      <img class="off" src="images/arrow2.png" alt="next">
      <img class="on" src="images/arrow2-hover.png" alt="">
    </a>
  </main>
</body>
</html>
