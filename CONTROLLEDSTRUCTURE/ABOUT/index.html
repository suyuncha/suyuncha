  <title>ABOUT — Controlled Structure</title>
  <link rel="stylesheet" href="style.css" />

    <div class="page-title">ABOUT</div>

    <text class="desc" x="550" y="645">Born from obsession, built through control. A study of repetition, tension, and the structure that holds it all together.</text>
