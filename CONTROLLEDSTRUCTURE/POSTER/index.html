<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POSTERS — Controlled Structure</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="top-bar">
    <div class="page-title">POSTERS</div>
  </div>

  <button class="close-btn" id="close-btn">X</button>

  <section class="poster-section">
    <div class="poster-item">
      <img src="poster1.jpg" alt="poster 01" />
      <div class="poster-number">01</div>
    </div>
    <div class="poster-item">
      <img src="poster2.jpg" alt="poster 02" />
      <div class="poster-number">02</div>
    </div>
    <div class="poster-item">
      <img src="poster3.jpg" alt="poster 03" />
      <div class="poster-number">03</div>
    </div>
    <div class="poster-item">
      <img src="poster4.jpg" alt="poster 04" />
      <div class="poster-number">04</div>
    </div>
    <div class="poster-item">
      <img src="poster5.jpg" alt="poster 05" />
      <div class="poster-number">05</div>
    </div>
  </section>

  <div class="poster-preview" id="poster-preview">
    <img src="" alt="preview" id="preview-img" />
  </div>

  <script src="script.js"></script>
</body>
</html>
